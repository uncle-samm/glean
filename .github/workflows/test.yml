name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.1"
          rebar3-version: "3"
      # TEMPORARY: print what `gleam add` / `gleam update` change, so the
      # result can be committed. Removed before merge.
      - name: Dependency update preview
        run: |
          gleam add --dev gleam_time
          gleam update
          git diff gleam.toml manifest.toml
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - name: Benchmarks
        run: gleam run -m glean_bench
      - name: Show formatting diff
        if: failure()
        run: gleam format src test && git diff -- src test
